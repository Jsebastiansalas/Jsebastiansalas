<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="15">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="c1"><rect x="44" y="60" height="24" width="0"><animate attributeName="width" from="0" to="80" begin="0.4s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="44" y="112" height="24" width="0"><animate attributeName="width" from="0" to="120" begin="1.8s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="44" y="164" height="24" width="0"><animate attributeName="width" from="0" to="110" begin="3.2s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="44" y="216" height="24" width="0"><animate attributeName="width" from="0" to="180" begin="4.6s" dur="0.7s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- Window -->
  <rect x="1.5" y="1.5" width="817" height="327" rx="12" fill="#0d1117" stroke="url(#border)" stroke-width="2"/>
  <path d="M1.5 13.5a12 12 0 0 1 12-12h793a12 12 0 0 1 12 12V36H1.5z" fill="#161b22"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="19" r="6" fill="#27c93f"/>
  <text x="410" y="24" text-anchor="middle" fill="#8b949e" font-size="13">sebastian@portfolio: ~</text>

  <!-- 1 -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="0.3s" dur="0.1s" fill="freeze"/>
    <text x="24" y="78" fill="#a78bfa" font-weight="bold">❯</text>
  </g>
  <text x="44" y="78" fill="#e6edf3" clip-path="url(#c1)">whoami</text>
  <text x="24" y="102" fill="#c9d1d9" opacity="0">Sebastián Salas · Full Stack Developer · Girón, Colombia
    <animate attributeName="opacity" to="1" begin="1.0s" dur="0.3s" fill="freeze"/></text>

  <!-- 2 -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="1.7s" dur="0.1s" fill="freeze"/>
    <text x="24" y="130" fill="#a78bfa" font-weight="bold">❯</text>
  </g>
  <text x="44" y="130" fill="#e6edf3" clip-path="url(#c2)">cat role.txt</text>
  <text x="24" y="154" opacity="0"><tspan fill="#f97316">Full Stack</tspan><tspan fill="#c9d1d9"> (JS · Java &amp; Spring Boot)  +  </tspan><tspan fill="#22d3ee">IA</tspan><tspan fill="#c9d1d9"> (Python &amp; LangChain)</tspan>
    <animate attributeName="opacity" to="1" begin="2.5s" dur="0.3s" fill="freeze"/></text>

  <!-- 3 -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="3.1s" dur="0.1s" fill="freeze"/>
    <text x="24" y="182" fill="#a78bfa" font-weight="bold">❯</text>
  </g>
  <text x="44" y="182" fill="#e6edf3" clip-path="url(#c3)">ls skills/</text>
  <text x="24" y="206" fill="#58a6ff" opacity="0">javascript/  spring-boot/  mysql/  postgresql/  langchain/  scrum/
    <animate attributeName="opacity" to="1" begin="3.8s" dur="0.3s" fill="freeze"/></text>

  <!-- 4 -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="4.5s" dur="0.1s" fill="freeze"/>
    <text x="24" y="234" fill="#a78bfa" font-weight="bold">❯</text>
  </g>
  <text x="44" y="234" fill="#e6edf3" clip-path="url(#c4)">./hire-me --status</text>
  <text x="24" y="258" fill="#22c55e" opacity="0">✔ Disponible para nuevas oportunidades · remoto / híbrido
    <animate attributeName="opacity" to="1" begin="5.4s" dur="0.3s" fill="freeze"/></text>

  <!-- Final prompt + blinking cursor -->
  <g opacity="0"><animate attributeName="opacity" to="1" begin="6.0s" dur="0.1s" fill="freeze"/>
    <text x="24" y="292" fill="#a78bfa" font-weight="bold">❯</text>
  </g>
  <rect x="44" y="279" width="9" height="17" fill="#a78bfa" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="6.0s" repeatCount="indefinite"/>
  </rect>
</svg>

